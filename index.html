<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>「性の健康」クイズ｜いだてんクリニック</title>
<meta name="description" content="「性の健康」、どこまで本当に知っていますか。梅毒・HIVの予防・男性更年期・ジェンダーについてのクイズ。いだてんクリニック（大阪院・博多駅前院）">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════
   スタンドアローン確認用のページ側スタイル
   オウンドメディアに埋め込むときは、このブロックだけ削除
   ══════════════════════════════════════════════════════════ */
html,body{margin:0;padding:0;background:#F1EAE0;overflow-x:clip}
body{padding:18px 14px 40px}
/* ══════════════════════════════════════════════════════════ */


/* ══════════════════════════════════════════════════════════
   ここから下が本体。#ic-quiz の中で完結します
   ══════════════════════════════════════════════════════════ */
#ic-quiz{
  /* 採用LPと共通のトークン */
  --navy:#0F2D70; --navy-d:#0B2359; --blue:#003973; --teal:#578D8D;
  --gold:#B1986A; --gold-d:#8E7448; --gold-l:#E6D9C2;
  --cream:#FAF7F2; --sand:#F1EAE0; --ink:#1F1B18; --muted:#6B645C; --line:#E4DCD1;
  --sh-d:rgba(92,76,58,.14); --sh-l:rgba(255,252,246,.9);
  --shadow-out:9px 9px 22px var(--sh-d),-9px -9px 22px var(--sh-l);
  --shadow-out-sm:5px 5px 12px var(--sh-d),-5px -5px 12px var(--sh-l);
  --shadow-in:inset 4px 4px 10px var(--sh-d),inset -4px -4px 10px var(--sh-l);

  /* レインボー */
  --r1:#C8455E; --r2:#DD7A34; --r3:#C9971B; --r4:#3E8E6E; --r5:#2E6FA7; --r6:#7B4B94; --r7:#A0417E;
  --deep:#3A2E52;
  --hero:linear-gradient(135deg,#5A3576 0%,#2E6FA7 42%,#3E8E6E 72%,#C9971B 100%);
  --ring:linear-gradient(90deg,var(--r1),var(--r2),var(--r3),var(--r4),var(--r5),var(--r6));
  --btn:linear-gradient(92deg,#7B4B94 0%,#2E6FA7 100%);
  --btn-sh:rgba(76,55,120,.30); --focus:#7B4B94;
  --q1:var(--r1); --q2:var(--r2); --q3:var(--r3); --q4:var(--r4); --q5:var(--r5); --q6:var(--r6); --q7:var(--r7);

  max-width:560px;margin:0 auto;background:var(--cream);border-radius:22px;overflow:hidden;
  font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  color:var(--ink);line-height:1.8;font-size:16px;letter-spacing:.01em;text-align:left;
  box-shadow:0 18px 44px rgba(31,27,24,.14);
  touch-action:manipulation;-webkit-font-smoothing:antialiased;overflow-wrap:break-word;
}
/* テーマCSSに負けないためのリセット */
#ic-quiz *,#ic-quiz *::before,#ic-quiz *::after{box-sizing:border-box;margin:0;padding:0}
#ic-quiz div,#ic-quiz section,#ic-quiz header,#ic-quiz p,#ic-quiz ul,#ic-quiz li,#ic-quiz h2,#ic-quiz h3{display:block;float:none;width:auto;max-width:none;min-height:0}
#ic-quiz span,#ic-quiz b,#ic-quiz small,#ic-quiz a{display:inline}
#ic-quiz li::before,#ic-quiz li::after{content:none}
#ic-quiz button{font-family:inherit;letter-spacing:inherit;border:0;background:none;cursor:pointer;color:inherit}
#ic-quiz :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
@media(prefers-reduced-motion:reduce){#ic-quiz *{transition:none!important;animation:none!important}}

/* --- ヒーロー --- */
#ic-quiz .rbar{height:5px;display:grid;grid-template-columns:repeat(6,1fr)}
#ic-quiz .rbar i:nth-child(1){background:var(--r1)}
#ic-quiz .rbar i:nth-child(2){background:var(--r2)}
#ic-quiz .rbar i:nth-child(3){background:var(--r3)}
#ic-quiz .rbar i:nth-child(4){background:var(--r4)}
#ic-quiz .rbar i:nth-child(5){background:var(--r5)}
#ic-quiz .rbar i:nth-child(6){background:var(--r6)}
#ic-quiz .qhero{background:var(--hero);color:#fff;padding:16px 18px 24px;text-align:center}
#ic-quiz .lang{display:flex;justify-content:flex-end;margin-bottom:10px}
#ic-quiz .lang .sw{display:flex;gap:2px;background:rgba(255,255,255,.2);border-radius:999px;padding:3px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#ic-quiz .lang button{font-family:"Josefin Sans","Noto Sans JP",sans-serif;font-size:11.5px;font-weight:700;
  letter-spacing:.1em;color:rgba(255,255,255,.85);padding:6px 13px;border-radius:999px;line-height:1.4;
  transition:background .16s,color .16s;min-height:30px}
#ic-quiz .lang button:hover{color:#fff}
#ic-quiz .lang button[aria-pressed="true"]{background:#fff;color:var(--deep)}
#ic-quiz .qhero .en2{font-family:"Josefin Sans","Noto Sans JP",sans-serif;font-weight:600;letter-spacing:.24em;font-size:11px;
  color:rgba(255,255,255,.72);text-transform:uppercase;display:block;margin-bottom:9px}
#ic-quiz .qhero h2{font-size:22px;font-weight:900;line-height:1.5;letter-spacing:.02em;color:#fff}
#ic-quiz .qhero h2 em{font-style:normal;font-weight:900;box-shadow:inset 0 -.5em 0 rgba(255,255,255,.22);padding:0 2px}
#ic-quiz .qhero p{font-size:13.5px;color:rgba(255,255,255,.86);margin-top:8px;line-height:1.7}

#ic-quiz .qbody{padding:22px 20px 26px}

/* --- はじめに（属性・任意） --- */
#ic-quiz .intro .lead{font-size:14px;color:var(--muted);line-height:1.8;margin-bottom:4px}
#ic-quiz .intro .lead b{color:var(--deep)}
#ic-quiz .intro .grp{margin-top:18px}
#ic-quiz .intro .lb{font-size:14.5px;font-weight:700;color:var(--deep);letter-spacing:.01em}
#ic-quiz .intro .hint{display:block;font-size:12.5px;font-weight:400;color:var(--muted);margin-top:1px;line-height:1.6}
#ic-quiz .intro .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#ic-quiz .intro .chips button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;
  background:var(--cream);border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:700;
  color:var(--muted);box-shadow:var(--shadow-out-sm);transition:transform .12s,color .12s,box-shadow .12s;line-height:1.5}
#ic-quiz .intro .chips button:hover{transform:translateY(-1px);color:var(--deep)}
#ic-quiz .intro .chips button[aria-pressed="true"]{background:var(--btn);color:#fff;box-shadow:0 6px 14px var(--btn-sh)}
#ic-quiz .intro .chips button.pass{font-weight:500;font-size:13px}
#ic-quiz .intro .skip{display:block;width:100%;text-align:center;margin-top:14px;font-size:13.5px;font-weight:700;
  color:var(--muted);padding:10px;border-radius:999px;line-height:1.6}
#ic-quiz .intro .skip:hover{color:var(--deep);text-decoration:underline}
#ic-quiz .intro .fine{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.75}

/* --- 進捗 --- */
#ic-quiz .prog{display:flex;align-items:center;gap:8px;margin-bottom:20px}
#ic-quiz .prog .dots{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;flex:1}
#ic-quiz .prog .dots span{height:7px;border-radius:99px;background:rgba(31,27,24,.10);transition:background .3s}
#ic-quiz .prog .dots span:nth-child(1).on{background:var(--r1)}
#ic-quiz .prog .dots span:nth-child(2).on{background:var(--r2)}
#ic-quiz .prog .dots span:nth-child(3).on{background:var(--r3)}
#ic-quiz .prog .dots span:nth-child(4).on{background:var(--r4)}
#ic-quiz .prog .dots span:nth-child(5).on{background:var(--r5)}
#ic-quiz .prog .dots span:nth-child(6).on{background:var(--r6)}
#ic-quiz .prog .dots span:nth-child(7).on{background:var(--r7)}
#ic-quiz .prog .cnt{font-family:"Josefin Sans","Noto Sans JP",sans-serif;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap;letter-spacing:.08em}

/* --- 設問 --- */
#ic-quiz .qno{font-family:"Josefin Sans","Noto Sans JP",sans-serif;font-weight:700;letter-spacing:.2em;font-size:11.5px;
  text-transform:uppercase;display:block;margin-bottom:9px;color:var(--qc,var(--r6))}
#ic-quiz .qtext{font-size:19px;font-weight:700;line-height:1.65;color:var(--deep);letter-spacing:.01em}
#ic-quiz .qtext em{font-style:normal;font-weight:900;border-bottom:3px solid var(--qc,var(--gold-l));padding-bottom:1px}

/* --- ○× --- */
#ic-quiz .ox{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
#ic-quiz .ox button{background:var(--cream);border-radius:18px;padding:20px 6px 16px;box-shadow:var(--shadow-out);
  transition:transform .14s,box-shadow .14s;display:flex;flex-direction:column;align-items:center;gap:5px}
#ic-quiz .ox button:hover{transform:translateY(-2px);box-shadow:12px 12px 26px var(--sh-d),-12px -12px 26px var(--sh-l)}
#ic-quiz .ox button:active{box-shadow:var(--shadow-in);transform:none}
#ic-quiz .ox .mk{width:46px;height:46px;stroke-width:3.4;fill:none;stroke-linecap:round;stroke:var(--r4)}
#ic-quiz .ox button:last-child .mk{stroke:var(--r1)}
#ic-quiz .ox .lb{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.06em}

/* --- 判定 --- */
#ic-quiz .fb{margin-top:20px;border-radius:18px;padding:18px 19px;box-shadow:var(--shadow-in);background:var(--sand);text-align:left}
#ic-quiz .fb .vd{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:900;letter-spacing:.02em}
#ic-quiz .fb .vd .mk{width:22px;height:22px;stroke-width:3.4;fill:none;stroke-linecap:round}
#ic-quiz .fb.hit .vd{color:var(--r4)} #ic-quiz .fb.hit .vd .mk{stroke:var(--r4)}
#ic-quiz .fb.miss .vd{color:var(--r1)} #ic-quiz .fb.miss .vd .mk{stroke:var(--r1)}
#ic-quiz .fb .ex{margin-top:9px;font-size:14px;line-height:1.85;color:#453F39;text-align:left}
#ic-quiz .fb .ex b{color:var(--deep)}

/* --- ボタン --- */
#ic-quiz .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:56px;padding:14px 28px;border-radius:999px;
  background:var(--btn);color:#fff;font-weight:700;font-size:16px;line-height:1.3;width:100%;
  box-shadow:0 10px 24px var(--btn-sh);transition:transform .15s,box-shadow .15s,filter .15s;margin-top:18px}
#ic-quiz .btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
#ic-quiz .btn .mk{width:17px;height:17px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
#ic-quiz .btn.ghost{background:none;color:var(--muted);box-shadow:var(--shadow-out-sm);font-size:14.5px;min-height:48px;font-weight:700}
#ic-quiz .btn.ghost:hover{filter:none;color:var(--deep)}
#ic-quiz .btn.ghost .mk{stroke:currentColor}

/* --- 結果 --- */
#ic-quiz .score{text-align:center;padding:6px 0 2px}
#ic-quiz .ring{width:148px;height:148px;margin:0 auto 16px;border-radius:50%;background:var(--ring);
  display:grid;place-items:center;box-shadow:0 14px 30px rgba(31,27,24,.16)}
#ic-quiz .ring .in{width:120px;height:120px;border-radius:50%;background:var(--cream);display:grid;place-items:center;align-content:center}
#ic-quiz .ring .n{font-family:"Josefin Sans","Noto Sans JP",sans-serif;font-weight:700;font-size:52px;line-height:1;color:var(--deep)}
#ic-quiz .ring .d{font-size:12px;color:var(--muted);letter-spacing:.14em;font-family:"Josefin Sans",sans-serif;font-weight:600;margin-top:5px}
#ic-quiz .score h3{font-size:21px;font-weight:900;color:var(--deep);line-height:1.4;letter-spacing:.02em}
#ic-quiz .score h3.en3{font-family:"Josefin Sans","Noto Sans JP",sans-serif;font-weight:700;font-size:27px;letter-spacing:.1em}
#ic-quiz .score p{font-size:14px;color:var(--muted);margin-top:7px;line-height:1.75}

#ic-quiz .show{position:relative;margin-top:22px;border-radius:18px;padding:20px 18px;text-align:center;background:var(--sand);box-shadow:var(--shadow-in)}
#ic-quiz .show .ttl{font-size:15px;font-weight:900;color:var(--deep);letter-spacing:.02em}
#ic-quiz .show .stamp{margin:13px auto 0;width:90px;height:90px;border-radius:50%;background:var(--btn);display:grid;place-items:center;
  box-shadow:0 10px 22px var(--btn-sh)}
#ic-quiz .show .stamp .mk{width:44px;height:44px;stroke:#fff;stroke-width:3.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
#ic-quiz .show .tm{margin-top:11px;font-family:"Josefin Sans","Noto Sans JP",sans-serif;font-size:12.5px;color:var(--muted);letter-spacing:.1em}

/* --- スタッフのスタンプ（2本指で3回タップ） --- */
#ic-quiz .show.done .stamp,#ic-quiz .show.done .tm{display:none}
#ic-quiz .seal{width:min(186px,72%);aspect-ratio:1/1;margin:14px auto 2px;
  pointer-events:none;color:var(--navy);transform:rotate(-8deg)}
#ic-quiz .seal.master{color:#8E7448}
#ic-quiz .seal svg{width:100%;height:100%;display:block}
#ic-quiz .seal.now{animation:sealin .52s cubic-bezier(.2,1.5,.4,1) both}
@keyframes sealin{
  0%{opacity:0;transform:rotate(-16deg) scale(2.1)}
  50%{opacity:1;transform:rotate(-8deg) scale(.92)}
  72%{transform:rotate(-8deg) scale(1.05)}
  100%{opacity:1;transform:rotate(-8deg) scale(1)}
}

/* --- 結果のあと --- */
#ic-quiz .after{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
#ic-quiz .after .en2{font-family:"Josefin Sans","Noto Sans JP",sans-serif;font-weight:600;letter-spacing:.24em;font-size:11px;
  color:var(--r6);text-transform:uppercase;display:block;margin-bottom:8px}
#ic-quiz .after h3{font-size:17px;font-weight:700;color:var(--deep);line-height:1.5}
#ic-quiz .after .lnk{margin-top:14px;display:grid;gap:10px}
#ic-quiz .after .lnk a{display:flex;align-items:center;gap:11px;background:var(--cream);border-radius:14px;padding:14px 16px;
  box-shadow:var(--shadow-out-sm);text-decoration:none;color:var(--ink);font-size:14.5px;font-weight:700;transition:transform .14s}
#ic-quiz .after .lnk a:hover{transform:translateX(3px)}
#ic-quiz .after .lnk .mk{width:19px;height:19px;stroke:var(--r6);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
#ic-quiz .after .lnk .ar{margin-left:auto;width:15px;height:15px;stroke:var(--muted);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
#ic-quiz .after .fine{margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.75}

#ic-quiz .foot{background:var(--sand);padding:15px 20px;text-align:center;font-size:11.5px;color:var(--muted);letter-spacing:.04em;cursor:default;user-select:none;-webkit-user-select:none}

/* --- チャレンジ（超難問） --- */
#ic-quiz .chbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:14px;
  min-height:54px;padding:12px 20px;border-radius:999px;font-size:15px;font-weight:900;letter-spacing:.02em;
  color:var(--gold-d);background:var(--cream);box-shadow:var(--shadow-out-sm),0 0 0 2px var(--gold) inset;
  transition:transform .14s,box-shadow .14s;line-height:1.4}
#ic-quiz .chbtn:hover{transform:translateY(-2px)}
#ic-quiz .chbtn .mk{width:20px;height:20px;stroke:var(--gold-d);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}

#ic-quiz .chhead{text-align:center;padding:4px 0 2px}
#ic-quiz .chhead .badge{display:inline-flex;align-items:center;gap:7px;font-family:"Josefin Sans","Noto Sans JP",sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-d);
  border:1.5px solid var(--gold);border-radius:999px;padding:5px 14px}
#ic-quiz .chhead h3{margin-top:14px;font-size:23px;font-weight:900;color:var(--deep);line-height:1.4;letter-spacing:.02em}
#ic-quiz .chhead p{margin-top:10px;font-size:14px;color:var(--muted);line-height:1.8}
#ic-quiz .chhead p b{color:var(--gold-d)}
#ic-quiz .chrule{margin-top:18px;background:var(--sand);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow-in);text-align:left}
#ic-quiz .chrule li{list-style:none;display:flex;gap:9px;font-size:13.5px;color:#453F39;line-height:1.75}
#ic-quiz .chrule li + li{margin-top:7px}
#ic-quiz .chrule li::before{content:"";flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:9px}

#ic-quiz .choices{display:grid;gap:10px;margin-top:20px}
#ic-quiz .choices button{display:flex;align-items:center;gap:12px;text-align:left;background:var(--cream);border-radius:14px;
  padding:15px 17px;font-size:15px;font-weight:700;color:var(--ink);box-shadow:var(--shadow-out-sm);
  transition:transform .13s,box-shadow .13s;line-height:1.6;min-height:56px}
#ic-quiz .choices button:hover{transform:translateX(3px)}
#ic-quiz .choices button .kb{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-family:"Josefin Sans",sans-serif;font-size:13px;font-weight:700;color:#fff;background:var(--btn)}
#ic-quiz .choices button.right{box-shadow:var(--shadow-out-sm),0 0 0 2.5px var(--r4) inset}
#ic-quiz .choices button.wrong{box-shadow:var(--shadow-out-sm),0 0 0 2.5px var(--r1) inset;opacity:.7}
#ic-quiz .choices button:disabled{cursor:default}

/* --- 認定証 --- */
#ic-quiz .cert{position:relative;margin-top:4px;border-radius:20px;padding:26px 20px 22px;text-align:center;
  background:linear-gradient(160deg,#0B2359 0%,#132F63 55%,#1B2E52 100%);color:#fff;
  box-shadow:0 16px 34px rgba(11,35,89,.3)}
#ic-quiz .cert::before{content:"";position:absolute;inset:9px;border:1.5px solid rgba(214,187,132,.55);border-radius:13px;pointer-events:none}
#ic-quiz .cert .crest{width:74px;height:74px;margin:0 auto 12px;display:block}
#ic-quiz .cert .kicker{font-family:"Josefin Sans","Noto Sans JP",sans-serif;font-size:10.5px;letter-spacing:.26em;
  text-transform:uppercase;color:#D6BB84}
#ic-quiz .cert h3{margin-top:9px;font-size:29px;font-weight:900;letter-spacing:.06em;color:#fff;line-height:1.3}
#ic-quiz .cert .sub{margin-top:9px;font-size:13px;color:rgba(255,255,255,.8);line-height:1.75}
#ic-quiz .cert .noline{margin-top:16px;padding-top:14px;border-top:1px solid rgba(214,187,132,.3);
  font-family:"IBM Plex Mono","Josefin Sans",monospace;font-size:12px;color:#D6BB84;letter-spacing:.14em}
#ic-quiz .cert .fine{margin-top:8px;font-size:10.5px;color:rgba(255,255,255,.45);line-height:1.7}

#ic-quiz .miss{margin-top:4px;border-radius:18px;padding:22px 20px;text-align:center;background:var(--sand);box-shadow:var(--shadow-in)}
#ic-quiz .miss h3{font-size:19px;font-weight:900;color:var(--deep);line-height:1.45}
#ic-quiz .miss p{margin-top:9px;font-size:14px;color:var(--muted);line-height:1.8}

/* --- 離脱の確認 --- */
#ic-quiz .ask{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:22px;
  background:rgba(20,16,32,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:qin .2s ease-out}
#ic-quiz .askbox{width:100%;max-width:360px;background:var(--cream);border-radius:20px;padding:24px 22px 20px;text-align:center;
  box-shadow:0 22px 50px rgba(20,16,32,.4)}
#ic-quiz .askbox .ai{width:52px;height:52px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;
  background:var(--sand);box-shadow:var(--shadow-in)}
#ic-quiz .askbox .ai svg{width:26px;height:26px;stroke:var(--gold-d);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
#ic-quiz .askbox .at{font-size:17px;font-weight:900;color:var(--deep);line-height:1.5}

            '<p>' + UI.missSub + '</p>' +
          '</div>' +
          '<button type="button" class="btn" id="cretry"><span>'+UI.chRetry+'</span>' + MK.ar + '</button>' +
          '<button type="button" class="btn ghost" id="cdone">' + MK.rt + '<span>'+UI.chBack+'</span></button>' +
        '</div>';
      document.getElementById('cretry').addEventListener('click', function(){
        cidx = 0; chits = 0; cAttempt++; renderCQ();
      });
    }
    document.getElementById('cdone').addEventListener('click', renderResult);
  }

  /* ══ ステッカーを受け取る前にページを離れようとしたとき ══ */
  function hasSticker(){ return !!readStamp() || !!body.querySelector('.seal'); }
  function askBeforeLeave(url){
    var d = document.createElement('div');
    d.className = 'ask'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true');
    d.innerHTML = '<div class="askbox">' +
      '<div class="ai"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5v5M12 17h.01"/><circle cx="12" cy="12" r="9.2"/></svg></div>' +
      '<p class="at">'+UI.askTitle+'</p>' +
      '<p class="ad">'+UI.askDesc+'</p>' +
      '<button type="button" class="btn" id="askstay"><span>'+UI.askStay+'</span></button>' +
      '<button type="button" class="btn ghost" id="askgo"><span>'+UI.askGo+'</span></button>' +
      '</div>';
    root.appendChild(d);
    d.querySelector('#askstay').addEventListener('click', function(){ d.remove(); });
    d.querySelector('#askgo').addEventListener('click', function(){ d.remove(); window.location.href = url; });
    d.addEventListener('click', function(e){ if (e.target === d) d.remove(); });
    track('leave_warned', {});
  }
  function guardLinks(){
    var as = body.querySelectorAll('.after .lnk a');
    Array.prototype.forEach.call(as, function(a){
      a.addEventListener('click', function(e){
        if (hasSticker()) return;
        e.preventDefault();
        askBeforeLeave(a.getAttribute('href'));
      });
    });
  }

  /* ══ スタッフ用スタンプ（画面を2本指で3回タップ）══
     受け取り済みの目印。端末のローカルにだけ残る簡易な印で、認証ではない。 */
  var SKEY = 'idaten_pledge_stamped';
  var MKEY = 'idaten_pledge_master';
  function readStamp(){ try { return localStorage.getItem(SKEY); } catch(e){ return null; } }
  function writeStamp(v){ try { v ? localStorage.setItem(SKEY, v) : localStorage.removeItem(SKEY); } catch(e){} }
  function readMaster(){ try { return localStorage.getItem(MKEY); } catch(e){ return null; } }
  function writeMaster(v){ try { v ? localStorage.setItem(MKEY, v) : localStorage.removeItem(MKEY); } catch(e){} }

  function sealHTML(when, master){
    var top = master ? UI.sealTopM : UI.sealTop;
    var mid = master ? UI.sealMidM : UI.sealMid;
    var cls = master ? 'seal now master' : 'seal now';
    return '<div class="' + cls + '" aria-hidden="true"><svg viewBox="0 0 180 180">' +
      '<circle cx="90" cy="90" r="84" fill="none" stroke="currentColor" stroke-width="5.5"/>' +
      '<circle cx="90" cy="90" r="73" fill="none" stroke="currentColor" stroke-width="1.8"/>' +
      '<text x="90" y="62" text-anchor="middle" font-family="Noto Sans JP" font-size="'+(LANG==='en'?13:15)+'" font-weight="700" fill="currentColor" letter-spacing="1">' + top + '</text>' +
      '<path d="M40 72 H140" stroke="currentColor" stroke-width="1.4"/>' +
      '<text x="90" y="112" text-anchor="middle" font-family="Noto Sans JP" font-size="'+(LANG==='en'?26:35)+'" font-weight="900" fill="currentColor" letter-spacing="'+(LANG==='en'?1:3)+'">' + mid + '</text>' +
      '<text x="90" y="136" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="currentColor" letter-spacing="1">' + when + '</text>' +
      '</svg></div>';
  }
  function paintStamp(when, animate, master){
    var box = body.querySelector('.show'); if (!box) return;
    var old = box.querySelector('.seal'); if (old) old.remove();
    box.classList.add('done');
    var t = box.querySelector('.ttl');
    if (t) t.textContent = master ? UI.handedMaster : UI.handed;
    box.insertAdjacentHTML('beforeend', sealHTML(when, master));
    if (!animate) box.querySelector('.seal').classList.remove('now');
    if (!master) syncChallenge();
  }
  function clearStamp(master){
    var box = body.querySelector('.show'); if (!box) return;
    var old = box.querySelector('.seal'); if (old) old.remove();
    box.classList.remove('done');
    var t = box.querySelector('.ttl');
    if (t) t.textContent = master ? UI.masterReady : UI.showStaff;
    if (!master) syncChallenge();
  }
  /* 受取済のスタンプが押され、かつ全問正解のときだけチャレンジを開く */
  function syncChallenge(){
    var host = body.querySelector('#again'); if (!host) return;
    var old = body.querySelector('.chbtn, .chlock'); if (old) old.remove();
    if (!readStamp() && !body.querySelector('.seal')) return;

    if (lastScore === Q.length) {
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'chbtn';
      btn.innerHTML = BOLT + '<span>' + (readMaster() ? UI.chSeen : UI.chOpen) + '</span>';
      btn.addEventListener('click', renderChIntro);
      host.parentNode.insertBefore(btn, host);
    } else if (lastScore >= 5) {
      var lk = document.createElement('p');
      lk.className = 'chlock';
      lk.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/></svg>' +
        '<span>' + fill(UI.chLock, { n: Q.length }) + '</span>';
      host.parentNode.insertBefore(lk, host);
    }
  }

  var lastToggle = 0;
  function toggleStamp(){
    var box = body.querySelector('.show'); if (!box) return;   // 結果／認定画面以外では効かない
    var isMaster = !!body.querySelector('.cert');
    var read = isMaster ? readMaster : readStamp;
    var write = isMaster ? writeMaster : writeStamp;
    var now = Date.now();
    // 保存が使えない環境（シークレットモード等）でも取り消せるよう、画面の状態も見る
    if (box.querySelector('.seal') || read()) {
      if (now - lastToggle < 4000) { write(null); clearStamp(isMaster); }   // 押し間違いの取り消し
      return;
    }
    lastToggle = now;
    var w = stamp();
    write(w);
    paintStamp(w, true, isMaster);
    track(isMaster ? 'master_handed' : 'sticker_handed', {});
  }
  var taps = [];
  root.addEventListener('touchstart', function(e){
    if (!e.touches || e.touches.length !== 2) return;
    var now = Date.now();
    taps = taps.filter(function(t){ return now - t < 1600; });
    taps.push(now);
    if (taps.length >= 3) { taps = []; toggleStamp(); }
  }, { passive: true });
  root.addEventListener('icstamp', toggleStamp);

  /* 2本指のジェスチャーが効かない端末向けの代替。
     フッターの「IDATEN CLINIC」を1.6秒以内に3回クリックすると同じ動作になる */
  var footTaps = [];
  var footEl = root.querySelector('.foot');
  if (footEl) footEl.addEventListener('click', function(){
    var now = Date.now();
    footTaps = footTaps.filter(function(t){ return now - t < 1600; });
    footTaps.push(now);
    if (footTaps.length >= 3) { footTaps = []; toggleStamp(); }
  });

  /* ══ 送信：ENDPOINT が空なら何もしない。失敗しても画面には出さない ══ */
  function send(payload){
    if (!ENDPOINT) return;
    try {
      payload.at = new Date().toISOString();
      var b = new Blob([JSON.stringify(payload)], { type:'application/json' });
      if (navigator.sendBeacon) { navigator.sendBeacon(ENDPOINT, b); return; }
      fetch(ENDPOINT, { method:'POST', body:b, keepalive:true }).catch(function(){});
    } catch(e){}
  }

  function rerender(){
    var d = root.querySelector('.ask'); if (d) d.remove();
    if (view === 'intro')   { renderIntro(); return; }
    if (view === 'q')       { renderQ(lastPick); return; }
    if (view === 'result')  { renderResult(); return; }
    if (view === 'chintro') { renderChIntro(); return; }
    if (view === 'chq')     { renderCQ(lastCPick); return; }
    renderMaster();
  }

  var langBtns = root.querySelectorAll('.lang button');
  Array.prototype.forEach.call(langBtns, function(b){
    b.addEventListener('click', function(){ setLang(b.getAttribute('data-l')); });
  });

  applyLang();
  renderIntro();
})();
</script>
<p class="review-note">社内確認用（監修前）</p>
</body>
</html>
